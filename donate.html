<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Donation Towards a Better World</title>
        <meta charset="UTF-8">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!--Link to Font Awesome, a free icon provider-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="global.css">

        <style>
            body {
                background-color: #faebd7; 
            }

            /* The Flex Container */
            .donation-flex {
                display: flex;
                flex-direction: row;
                gap: 40px;
                align-items: center;
                padding: 50px 20px; /* Added some padding so it doesn't touch the screen edges */
                max-width: 1500px;
                margin: 0 auto; /* Centers the layout on large screens */
            }

            /* The Left Section */
            .donation-layout {
                flex: 3;
                align-self: flex-start;
                text-align: left;
            }

            /* The Right Section (QR Card) */
            .donation-qr {
                flex: 1;
                margin-left: auto;
                background-color: #ffffff;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            /* Sizing the QR Image inside the card */
            .donation-qr img {
                width: 40%;
                height: auto;
                margin-top: 15px;
            }

            .frequency-grid{
                display: grid;
                grid-template-columns: 100px 100px 100px;
                justify-content: center;
                gap: 20px;
                margin: 20px;
            }
            .amount-grid{
                display: grid;
                grid-template-columns: 100px 100px 100px 100px;
                grid-template-rows: 50px 50px;
                gap: 20px;
                margin: 20px;
            }

            .Donate-button{
                background-color: #ffffff;
                border: 1px solid #afaeae;
                padding: 15px 5px;
                border-radius: 12px;
                font-size: 1rem;
                cursor: pointer;
                transition: 0.2s;
            }

            .custom-amount-box{
                display: flex;
                flex-direction: column; /* Stacks the word "Other" on top of the input */
                align-items: center;    /* Centers them horizontally */
                justify-content: center;/* Centers them vertically */
                
                border: 1px solid #9aa0a7; /* Matches the button borders */
                border-radius: 12px;        /* Matches the button curves */
                background-color: #ffffff;
                padding: 5px;
            }

            .custom-amount-box input{
                width: 80%;
                height: 60%;
                border: 1px solid #ccc;
                border-radius: 4px;
                text-align: center;
                padding: 2px;
            }

            .custom-amount-box label{
                font-size: 0.75rem; /*smaller than usual*/
                margin-bottom: 3px;
            }

            .custom-amount-box.active{
                border: 2px solid #9aa0a7;
                background-color: #2229a5;
                color: #ffffff;
            }

            .Donate-button:hover{
                background-color: #2229a5;
                border-color: #000000;
            }

            .Donate-button.active {
                background-color: #2229a5;
                color: white;
            }

            .donation-divider {
                border: none;
                border-top: 2px solid #000000;
                margin: 15px 0;
            }

        </style>
    </head>

    <body> 
        
        <div id ="nav-placeholder"></div>
        
        <!--
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container">
                <a class="logo-box" href="Front-End-Assignment.html">
                    <i class="fa-solid fa-leaf"></i> GREEN<br>TECH
                </a>
            </div> 
        </nav>-->

       
        <main class="donation-flex"> 
            
            <!-- Applied the sizing class to the left section -->
            <section class="donation-layout">
                <h1>Green Tech is here to steal your MONEY</h1>
                <p>idk what to  really write here</p>
            </section>
            
            <!-- Right Section -->
            <section class="donation-qr">
                <form action="https://youtu.be/dQw4w9WgXcQ">
                    <h4>Donation amount (MYR)</h4>
                    <hr class="donation-divider">

                    <div class = "frequency-grid">
                        <button type="button" class="Donate-button">Once</button>
                        <button type="button" class="Donate-button">Monthly</button>
                        <button type="button" class="Donate-button">Yearly</button>
                    </div>

                    <div class = "amount-grid">
                        <button type="button" class="Donate-button">RM 10</button>
                        <button type="button" class="Donate-button">RM 30</button>
                        <button type="button" class="Donate-button">RM 50</button>
                        <button type="button" class="Donate-button">RM 100</button>

                        <button type="button" class="Donate-button">RM 500</button>
                        <button type="button" class="Donate-button">RM 1000</button>
                        <button type="button" class="Donate-button">RM 2000</button>   
                        
                        <div class = "custom-amount-box">
                            <label for="custom-amount">Other</label>
                            <input type="number" id = "custom-amount">
                        </div>
                    </div>

                    
                    <img src="images/QR .png" alt="Donation QR">
                </form>
            </section>
            
        </main>
        
        <!--The javascript for the event handling-->
        <script>
            const donatebtn = document.querySelectorAll(".amount-grid .Donate-button");
            const frequencybtn = document.querySelectorAll(".frequency-grid .Donate-button");
            const custombox = document.querySelector(".custom-amount-box");
            const customInput = document.querySelector("#custom-amount");

            //amount-grid btn
            for(let i = 0; i < donatebtn.length; i++){// loops and attach event to all btn
                donatebtn[i].onclick = function(e){

                    for(let j = 0; j <donatebtn.length; j++){ //Removes active 
                        donatebtn[j].classList.remove('active'); // active =  .Donate-button.active
                    }

                    custombox.classList.remove('active');//removes 'active' if accidentally clicked option
                    e.target.classList.add('active');
                };

            }
            customInput.onfocus = function(){
                for(let j = 0; j < donatebtn.length; j++){
                    donatebtn[j].classList.remove('active');
                }
                custombox.classList.add('active');
            };
            

            //frequency btn
            for(let i = 0; i < frequencybtn.length; i++){// loops and attach event to all btn
                frequencybtn[i].onclick = function(e){

                    for(let j = 0; j <frequencybtn.length; j++){ //Removes active 
                        frequencybtn[j].classList.remove('active'); // active =  .Donate-button.active
                    }
                    e.target.classList.add('active');
                };
            }
         </script>


        <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <!--Global Script-->
        <script src="global.js"></script>
    </body>
</html>

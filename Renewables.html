<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Renewable Energy Adoption</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!--Link to Font Awesome, a free icon provider-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="global.css">

        <style>
            .chart-window{
                max-width: 1000px;
                margin: 0 auto;
                margin-top: 20px;
                margin-bottom: 20px;

                background-color: #ffffff;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }

            .chart-window iframe{
                width: 100%;
                height: 600px;
                border: none;
                display: block; /*Removes default gap*/
            }

            .page-banner-1{
                background: linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8)), url("images/growth.jpg");
                background-size: cover; /*Forces image to fill space without strecthing*/
                background-position: center;
                background-repeat: no-repeat;

                height: 250px;
                width: 100%;

                display: flex;
                flex-direction: column;
                justify-content: left;
                align-items: flex-start;
                padding-left: 50px;
                padding-top: 50px;

                color: #ffffff;
                text-align: left;
            }

            .page-banner-2{
                background: linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8)), url("images/Hydro.jpg");
                background-size: cover; /*Forces image to fill space without strecthing*/
                background-position: center;
                background-repeat: no-repeat;

                height: 250px;
                width: 100%;

                display: flex;
                flex-direction: column;
                justify-content: left;
                align-items: flex-start;
                padding-left: 50px;
                padding-top: 50px;

                color: #ffffff;
                text-align: left;
            }

            .page-banner-3{
                background: linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8)), url("images/Solar.jpg");
                background-size: cover; /*Forces image to fill space without strecthing*/
                background-position: center;
                background-repeat: no-repeat;

                height: 250px;
                width: 100%;

                display: flex;
                flex-direction: column;
                justify-content: left;
                align-items: flex-start;
                padding-left: 50px;
                padding-top: 50px;

                color: #ffffff;
                text-align: left;
            }

            .page-banner-4{
                background: linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8)), url("images/Wind_2.jpg");
                background-size: 100% auto; /*Forces image to fill space without strecthing*/
                background-position: 25% 60%;
                background-repeat: no-repeat;

                height: 250px;
                width: 100%;

                display: flex;
                flex-direction: column;
                justify-content: left;
                align-items: flex-start;
                padding-left: 50px;
                padding-top: 50px;

                color: #ffffff;
                text-align: left;
            }

            .page-banner-5{
                background: linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8)), url("images/Biofuel_2.jpg");
                background-size: cover; /*Forces image to fill space without strecthing*/
                background-position: 50% 25%;
                background-repeat: no-repeat;

                height: 250px;
                width: 100%;

                display: flex;
                flex-direction: column;
                justify-content: left;
                align-items: flex-start;
                padding-left: 50px;
                padding-top: 50px;

                color: #ffffff;
                text-align: left;
            }
        </style>


    </head>
    <body>
        <div id = "nav-placeholder"></div>
       
        <!--Renewable in shares of primary energy -->
        <section class="page-banner-1">
            <h3>Statistical Proof of the advancements and adoption of renewable energy can show us that CHANGE IS POSSIBLE </h3>
        </section>
        <div class ="chart-window">
            <iframe src="https://ourworldindata.org/grapher/energy-mix?country=BRA~GBR~PHL&source=renewables&metric=share&tab=map&hideControls=true" 
                    loading="lazy"
                    scrolling = "no"
                    allow="web-share; clipboard-write"></iframe>
        </div>

        
        <!--Hydro-->
        <section class = "page-banner-2"></section>
        <div class ="chart-window">
            <iframe src="https://ourworldindata.org/grapher/electricity-mix?country=CHN~IND~BWA~USA~SWE~FRA&source=hydro&metric=generation&frequency=annual&tab=map&hideControls=true" 
                    loading="lazy"
                    allow="web-share; clipboard-write"></iframe>
        </div>

        
        <!--Solar-->
        <section class="page-banner-3"></section>
        <div class = "chart-window">
            <iframe src="https://ourworldindata.org/grapher/electricity-mix?country=IND~CHN~AUS~USA~ZAF~ESP~OWID_WRL&source=solar&metric=generation&frequency=annual&tab=map&hideControls=true" 
                    loading="lazy" 
                    allow="web-share; clipboard-write"></iframe>
        </div>

        <!--Wind-->
        <section class="page-banner-4"></section>
        <div class = "chart-window">
            <iframe src="https://ourworldindata.org/grapher/electricity-mix?country=GBR~IND~AUS~NZL~DNK&source=wind&metric=generation&frequency=annual&tab=map&hideControls=true" 
                    loading="lazy" 
                    allow="web-share; clipboard-write"></iframe>
        </div>

        <!--BioFuel-->
        <section class="page-banner-5"></section>
        <div class = "chart-window">
           <iframe src="https://ourworldindata.org/grapher/biofuel-production?tab=map" 
           loading="lazy" 
           allow="web-share; clipboard-write"></iframe>
        </div>

        <div id="footer-placeholder"></div>

        <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

        <!-- 2. Load Bootstrap Library Second -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="global.js"></script>
    </body>
        

</html>
